<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <meta name="description" content="" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="module" src="/components/main.js"></script>
  </head>
  <body>
    <div data-component="navbar" data-active="home"></div>

    <main>
      <!-- Hero：滿版視覺區（圖片位置先留空）；品牌名、標語、描述語來自 品牌部/site-content/meta.json -->
      <section class="hero hero--brand" data-archive="hero">
        <div class="hero__visual" data-slot="hero-image">
          <div class="container">
            <p class="hero__descriptor" data-bind="descriptor"></p>
            <h1 class="hero__wordmark" data-bind="brand"></h1>
            <p class="hero__tagline" data-bind="tagline"></p>
            <div class="hero__actions">
              <a class="btn btn--lg" href="#products">認識我們</a>
            </div>
          </div>
        </div>
      </section>

      <!-- 品牌理念：meta.json 的 vision / quote；沒資料自動隱藏 -->
      <section class="section statement" data-archive="statement">
        <div class="container">
          <p class="statement__vision" data-bind="vision"></p>
          <blockquote class="hero__quote">
            <p data-bind="quote"></p>
            <cite data-bind="quote-author"></cite>
          </blockquote>
        </div>
      </section>

      <!-- 產品卡：品牌部/site-content/products.json；沒有資料自動隱藏 -->
      <section class="section" id="products" data-archive="products">
        <div class="container">
          <div class="products__grid"></div>
        </div>
      </section>

      <!-- 研究歷程入口（子項目，小區塊） -->
      <section class="research-strip" id="research">
        <div class="container research-strip__inner">
          <h2>研究歷程</h2>
          <ul class="research-strip__list" data-archive="stage-entry"></ul>
          <a class="btn btn--ghost btn--sm" href="./process.html">看完整歷程</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
