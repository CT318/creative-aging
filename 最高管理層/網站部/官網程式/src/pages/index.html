<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>品牌概念 | Brand</title>
    <meta name="description" content="品牌概念推廣入口 — 內容由 research-archive 動態載入。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="module" src="/components/main.js"></script>
  </head>
  <body>
    <div data-component="navbar" data-active="home"></div>

    <main>
      <!-- Hero：核心願景與引言金句來自 品牌部/site-content/meta.json -->
      <section class="hero" data-archive="hero">
        <div class="container hero__grid">
          <div>
            <span class="eyebrow">Vision</span>
            <h1 data-bind="vision"></h1>
            <blockquote class="hero__quote">
              <p data-bind="quote"></p>
              <cite data-bind="quote-author"></cite>
            </blockquote>
            <div class="hero__actions">
              <a class="btn" href="#pillars">探索概念</a>
              <a class="btn btn--ghost" href="./process.html">設計研究歷程</a>
            </div>
          </div>
          <div class="media ratio-4x3">
            <img data-bind="hero-image" alt="主視覺展示位" />
          </div>
        </div>
      </section>

      <!-- 概念：「概念提案」階段的圖片 -->
      <section class="section bg-alt" id="pillars">
        <div class="container">
          <div class="section__head">
            <span class="eyebrow">Concepts</span>
            <h2>品牌定調與產品概念</h2>
            <p class="muted">來自「概念提案」階段，點圖可放大。</p>
          </div>
          <div data-archive="gallery" data-stage="concepts"></div>
        </div>
      </section>

      <!-- 背景：「宏觀背景」階段的圖片 -->
      <section class="section" id="background">
        <div class="container">
          <div class="section__head">
            <span class="eyebrow">Background</span>
            <h2>研究背景與問題因果</h2>
            <p class="muted">來自「宏觀背景」階段，點圖可放大。</p>
          </div>
          <div data-archive="gallery" data-stage="macro"></div>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
