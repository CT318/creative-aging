<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>主題選擇頁</title><style>html,body{margin:0;background:#E9EDF3}
.slide{width:1920px;height:1080px;box-sizing:border-box;background:#FAFBFD;color:#14213D;font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',Arial,sans-serif;position:relative;overflow:hidden}
.slide *{box-sizing:border-box}
h2{position:absolute;left:110px;top:64px;margin:0;font-size:60px;font-weight:800;letter-spacing:2px}
.hmw{position:absolute;left:110px;right:110px;top:176px;height:104px;background:#14213D;border-radius:22px;display:flex;align-items:center;gap:28px;padding:0 40px}
.hmw .k{background:#0A7BBF;color:#fff;font-weight:800;font-size:30px;padding:6px 22px;border-radius:999px;letter-spacing:2px;white-space:nowrap}
.hmw p{margin:0;color:#fff;font-size:27px;line-height:1.5;font-weight:600}
.lab{position:absolute;left:110px;font-size:20px;font-weight:800;letter-spacing:1px;color:#0A7BBF}
.col{position:absolute;width:188px}
.step{height:270px;background:#fff;border:3px solid #0A7BBF;border-radius:22px;display:flex;flex-direction:column;align-items:center;padding-top:18px;text-align:center}
.step .n{width:44px;height:44px;border-radius:50%;background:#0A7BBF;color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step svg{width:76px;height:76px;margin:14px 0 8px;stroke:#0A7BBF;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.step .t{font-size:29px;font-weight:800;line-height:1.35}
.val{height:210px;margin-top:62px;background:#EAF4FB;border-radius:22px;padding:22px 8px;text-align:center;display:flex;align-items:center;justify-content:center;position:relative}
.val p{margin:0;font-size:26px;line-height:1.55;font-weight:700;color:#1B2E4E}
.val::before{content:"";position:absolute;left:50%;top:-44px;height:36px;border-left:3px dotted #7FA9C9}
svg.arr{position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none}

.hx{position:absolute;width:340px;height:393px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.hi{position:absolute;inset:5px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:0 40px}
.hi b{font-size:40px;line-height:1.3;font-weight:800;color:#14213D}
.hi span{font-size:26px;line-height:1.5;font-weight:600;color:#4A5873}
.panel{position:absolute;left:1260px;right:110px;top:250px}
.chip{display:inline-block;font-size:26px;font-weight:800;color:#0A6AA5;background:#EAF4FB;border:2px solid #C5DCEE;border-radius:999px;padding:6px 20px;margin:0 12px 30px 0}
.pt{display:flex;gap:16px;margin-bottom:34px}
.pt i{flex:none;width:12px;height:12px;border-radius:50%;background:#0A7BBF;margin-top:20px}
.pt p{margin:0;font-size:32px;line-height:1.55;font-weight:600;color:#26324B}
.note{position:absolute;left:110px;bottom:40px;font-size:22px;color:#8793A8}
</style></head><body><div class="slide">
<h2>自己選主題，想去哪座城市都可以</h2>
<div class="hx" style="left:110px;top:230px;background:#0A7BBF"><div class="hi" style="background:#fff"><b>世界各地<br>最大城市</b><span>東京・紐約・倫敦</span></div></div><div class="hx" style="left:458px;top:230px;background:#0A7BBF"><div class="hi" style="background:#fff"><b>日本城市</b><span>京都・大阪・札幌</span></div></div><div class="hx" style="left:806px;top:230px;background:#0A7BBF"><div class="hi" style="background:#fff"><b>台灣城市</b><span>台北・台南・花蓮</span></div></div><div class="hx" style="left:284px;top:525px;background:#0A7BBF"><div class="hi" style="background:#fff"><b>美國城市</b><span>紐約・舊金山<br>芝加哥</span></div></div><div class="hx" style="left:632px;top:525px;background:#9AA5B8"><div class="hi" style="background:#F1F3F7"><b>更多主題</b><span>自己喜歡的都可以</span></div></div>
<div class="panel"><span class="chip">自由選擇</span><span class="chip">收藏感</span>
<div class="pt"><i></i><p>一個主題＝一組月曆</p></div>
<div class="pt"><i></i><p>一座城市，一到兩週</p></div>
<div class="pt"><i></i><p>掃 QR 看城市介紹與大家的印象</p></div></div>
<div class="note">城市名稱僅為舉例</div></div></body></html>
