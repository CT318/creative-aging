<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>html,body{margin:0;background:#E9EDF3}
.slide{width:1920px;height:1080px;box-sizing:border-box;background:#FAFBFD;color:#14213D;font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',Arial,sans-serif;position:relative;overflow:hidden;page-break-after:always}
.slide *{box-sizing:border-box}
.kick{position:absolute;left:110px;top:62px;font-size:26px;font-weight:800;letter-spacing:5px;color:#0A7BBF}
h2{position:absolute;left:110px;top:104px;margin:0;font-size:58px;font-weight:800;letter-spacing:1px}
.steps{position:absolute;right:110px;top:70px;display:flex;gap:8px;align-items:center}
.steps span{font-size:21px;font-weight:700;color:#8A97AC;padding:6px 14px;border-radius:999px;background:#EEF2F7}
.steps span.on{background:#0A7BBF;color:#fff}
.steps i{width:10px;height:2px;background:#C3CDDA;display:block}
.pic{position:absolute;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(20,33,61,.18)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.panel{position:absolute;left:1320px;right:110px;top:250px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.chip{font-size:26px;font-weight:800;color:#0A6AA5;background:#EAF4FB;border:2px solid #C5DCEE;border-radius:999px;padding:6px 20px}
.pt{display:flex;gap:16px;margin-bottom:34px}
.pt b{flex:none;width:12px;height:12px;border-radius:50%;background:#0A7BBF;margin-top:20px}
.pt p{margin:0;font-size:32px;line-height:1.55;font-weight:600;color:#26324B;text-wrap:balance}
.row{position:absolute;left:110px;right:110px;top:730px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{background:#fff;border:2px solid #D5DEEA;border-radius:22px;padding:22px 28px;min-height:170px}
.card p{margin:0;font-size:31px;line-height:1.55;font-weight:600;color:#26324B}
.card .k{font-size:22px;font-weight:800;letter-spacing:3px;color:#0A7BBF;margin-bottom:6px}
.hx{position:absolute;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.hi{position:absolute;inset:5px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.note{position:absolute;left:110px;bottom:36px;font-size:22px;color:#8793A8}
</style></head><body><section class="slide"><div class="kick">VALUE</div><h2>這個設計的價值</h2><div class="card" style="position:absolute;left:110px;top:240px;width:820px;height:300px;padding:30px 36px"><div class="k" style="font-size:24px">長期參與</div><b style="display:block;font-size:42px;line-height:1.3;margin:6px 0 14px;font-weight:800">做完一座，還有下一座</b><p style="font-size:30px">兩天一件、兩週一座城。想去的城市就是下一次要畫的題材，不必重新決定畫什麼</p></div><div class="card" style="position:absolute;left:970px;top:240px;width:820px;height:300px;padding:30px 36px"><div class="k" style="font-size:24px">無壓力、低負擔</div><b style="display:block;font-size:42px;line-height:1.3;margin:6px 0 14px;font-weight:800">空白零件，自己畫就好</b><p style="font-size:30px">沒有範本、不趕進度，兩天才完成一件，小巧的紙件拿得動、放得下</p></div><div class="card" style="position:absolute;left:110px;top:570px;width:820px;height:300px;padding:30px 36px"><div class="k" style="font-size:24px">被看見、人與人的連結</div><b style="display:block;font-size:42px;line-height:1.3;margin:6px 0 14px;font-weight:800">城市讓大家有話聊</b><p style="font-size:30px">掃 QR 看城市介紹與大家的印象，去過的人分享、想去的人參考，作品也被看見</p></div><div class="card" style="position:absolute;left:970px;top:570px;width:820px;height:300px;padding:30px 36px"><div class="k" style="font-size:24px">收藏的意義</div><b style="display:block;font-size:42px;line-height:1.3;margin:6px 0 14px;font-weight:800">一座座拼成自己的世界</b><p style="font-size:30px">卡扣底座拼接，擺在展示櫃每天看得到；分出去過與想去，創作可以帶你去</p></div></section></body></html>
