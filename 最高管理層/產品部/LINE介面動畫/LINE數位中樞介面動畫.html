<style>

:root{
  --bg:#ffffff; --surface:#f6f7f9; --border:#e2e5ea; --text:#1f2328; --muted:#4a505b;
  --accent:#1d6fb8; --accent-soft:#e1eefb; --accent-line:#b9d5f1; --focus:#3b6fd4; --stagebg:#eef3f9;
  --dur:.45s;

  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --surface:#1b1f26; --border:#2d343e; --text:#e7eaef; --muted:#aab2bf;
  --accent:#8db5e8; --accent-soft:#1c2a3d; --accent-line:#3c5a82; --focus:#8db5e8; --stagebg:#1f242c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --surface:#1b1f26; --border:#2d343e; --text:#e7eaef; --muted:#aab2bf;
  --accent:#8db5e8; --accent-soft:#1c2a3d; --accent-line:#3c5a82; --focus:#8db5e8; --stagebg:#1f242c; color-scheme:dark}
@media (prefers-reduced-motion:reduce){:root{--dur:.01s}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;font-size:15px;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(24px,3.4vw,32px);line-height:1.25}
h2{font-size:22px;line-height:1.3}
h3{font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.chip.alt{background:var(--surface);color:var(--muted);border-color:var(--border)}
.viewer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}

.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.stp{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 10px}
.stp:hover{background:var(--surface)}
.stp .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent-line);display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stp .t{font-weight:500;color:var(--muted)}
.stp .body{grid-column:2;display:none;flex-direction:column;gap:8px;margin-top:4px}
.stp[aria-current="step"]{background:var(--accent-soft);border-color:var(--accent-line)}
.stp[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.stp[aria-current="step"] .t{color:var(--text);font-weight:700}

.body .d{font-size:14.5px}
.body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}

.time{font-size:10.5px;color:#3d5278;white-space:nowrap;text-align:right;line-height:1.2}
.date{align-self:center;background:rgba(40,60,100,.35);color:#fff;font-size:12px;padding:2px 12px;border-radius:12px}
.photo{width:210px;border-radius:16px;overflow:hidden;background:#fff;border:3px solid #fff}

.voice{display:flex;align-items:center;gap:8px;width:190px}

.card{width:282px;background:#fff;border-radius:6px 20px 20px 20px;overflow:hidden;flex:none}

.ct{font-size:20px;font-weight:700;line-height:1.3}
.cd{font-size:16px;color:#3f444c;line-height:1.5;margin-top:5px}
.cbtn{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.b1,.b2{height:46px;border-radius:10px;display:grid;place-items:center;font-size:17px;font-weight:700;text-align:center}
.b1{background:#06c755;color:#fff}
.b2{background:#fff;border:1.5px solid #cfd5dd;color:#333}
.car{display:flex;gap:8px;margin-left:48px;overflow:hidden;width:326px}

.qk{background:#fff;border:1.5px solid #cdd5e0;border-radius:999px;padding:9px 18px;font-size:16.5px;font-weight:700}

.rich{height:252px;flex:none;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:3px;background:#fff;border-top:3px solid #fff}
.cell{background:#e9f1fb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:20px;font-weight:700;color:#1d3a5c}
.cell svg{width:46px;height:46px}
.ibar{height:56px;flex:none;background:#fff;border-top:1px solid #e1e4e9;display:flex;align-items:center;gap:14px;padding:0 14px}
.ibar .in{flex:1;height:38px;border-radius:19px;background:#eff1f4;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#9aa0a8;font-size:17px}
.home{height:34px;flex:none;background:#fff;display:grid;place-items:center}
.home i{display:block;width:134px;height:5px;border-radius:3px;background:#111}
.ring{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:4px solid #2f6fb7;background:rgba(47,111,183,.12);box-shadow:0 0 0 7px rgba(47,111,183,.14);z-index:90;pointer-events:none;animation:pulse 1.1s ease-in-out infinite}
.ring.hold{width:84px;height:84px;margin:-42px 0 0 -42px}
@keyframes pulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{opacity:0;animation:pop .5s ease forwards;animation-delay:var(--d,0s)}
.fadein{animation:fade .45s ease both}
.ring.ringin{opacity:0;animation:fade .3s ease forwards,pulse 1.1s ease-in-out infinite;animation-delay:var(--d,1.6s)}
.noanim *,.noanim{animation:none!important}
.noanim .pop,.noanim .ringin{opacity:1}

body.still{background:transparent;padding:0;margin:0}

/* ---------- 插圖（SVG） ---------- */
function lcg(seed){let s=seed;return()=>((s=(s*1664525+1013904223)%4294967296)/4294967296)}
function floret(cx,cy,r,col,rot){let o='';for(let k=0;k<4;k++)o+=`<ellipse cx="${cx}" cy="${cy-r*.5}" rx="${r*.42}" ry="${r*.62}" transform="rotate(${k*90+rot} ${cx} ${cy})" fill="${col}" fill-opacity=".86" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/>`;return o+`<circle cx="${cx}" cy="${cy}" r="${r*.16}" fill="#fff" fill-opacity=".8"/>`}
function hyd(o={}){
  const rnd=lcg(11),cols=['#8fa8e8','#a58fe0','#c4a0e8','#7fb6ea','#b4c6f2','#d6a8e0','#9bb4ee'];
  let s=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs>`;
  if(o.paper)s+=`<rect width="200" height="200" fill="#fffdf6"/>`;
  s+=`<path d="M100 120C86 140 62 150 44 146c8-18 30-30 56-26z" fill="#6fae82" fill-opacity=".85"/><path d="M104 122c14 20 36 30 56 28-10-18-32-30-56-28z" fill="#5f9d7a" fill-opacity=".85"/><path d="M100 118c0 22-2 44 0 66" stroke="#5f8f6a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<34;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*60;s+=floret(100+Math.cos(a)*r,84+Math.sin(a)*r*.88,15+rnd()*6,cols[Math.floor(rnd()*cols.length)],rnd()*90)}
  if(o.smudge)s+=`<ellipse cx="66" cy="112" rx="40" ry="26" fill="#6f8be0" fill-opacity=".6" filter="url(#bl)"/>`;
  return s+'</svg>'}
function stepArt(n){
  let s=`<svg viewBox="0 0 280 160" xmlns="http://www.w3.org/2000/svg"><rect width="280" height="160" fill="#fbf8ef"/>`;
  const C=[[140,70,26],[108,98,24],[172,98,24]];
  const g='#7d8590';
  if(n>=3)for(const [x,y,r] of C)s+=`<circle cx="${x}" cy="${y}" r="${r+8}" fill="${x===140?'#a58fe0':x<140?'#8fa8e8':'#7fb6ea'}" fill-opacity=".4"/>`;
  for(const [x,y,r] of C)s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${g}" stroke-width="3" stroke-linecap="round"/>`;
  if(n>=2)for(const [x,y,r] of C)for(let k=0;k<5;k++){const a=k*72-90;s+=`<ellipse cx="${x+Math.cos(a*Math.PI/180)*(r+9)}" cy="${y+Math.sin(a*Math.PI/180)*(r+9)}" rx="9" ry="12" transform="rotate(${a+90} ${x+Math.cos(a*Math.PI/180)*(r+9)} ${y+Math.sin(a*Math.PI/180)*(r+9)})" fill="none" stroke="${g}" stroke-width="2.4"/>`}
  if(n>=3)s+=`<path d="M140 128c-4 12-4 22 0 30" stroke="#5f8f6a" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M140 146c16-6 26-4 34 2-10 4-24 4-34-2z" fill="#6fae82"/>`;
  return s+'</svg>'}
function sticker(o={}){
  return `<svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8,0) scale(.96)">${hyd().replace(/<svg[^>]*>|<\/svg>/g,'').replace(/<defs>[\s\S]*?<\/defs>/,'')}</g>
  <text x="110" y="214" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="40" font-weight="700" fill="#2f5fa8" stroke="#fff" stroke-width="8" paint-order="stroke" stroke-linejoin="round">早安！</text>
  <text x="110" y="240" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="17" font-weight="700" fill="#3c4a63" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">用心手繪的祝福</text></svg>`}
function waveHtml(n,seed){const r=lcg(seed);let o='';for(let i=0;i<n;i++)o+=`<i style="height:${6+Math.round(r()*18)}px"></i>`;return `<div class="wave">${o}</div>`}

/* ---------- 播放引擎 ---------- */
let cur=0,idx=0,timer=null,playing=false,prevN=-1;
function ringAt(scr,id,hold){
  if(!id)return;const t=scr.querySelector(`[data-tap="${id}"]`);if(!t)return;
  const sr=scr.getBoundingClientRect(),k=sr.width/scr.offsetWidth,r=t.getBoundingClientRect();
  const d=document.createElement('div');d.className='ring ringin'+(hold?' hold':'');
  const wide=r.width/k>150;d.style.left=((wide?r.right-52-sr.left:r.left+r.width/2-sr.left)/k)+'px';d.style.top=((r.top+r.height/2-sr.top)/k)+'px';
  d.style.setProperty('--d',STILL?'0s':'1.5s');scr.appendChild(d);
}
function show(f,i,animate){
  const scr=$('#scr');if(!scr)return;
  const step=F[f].steps[i];
  scr.innerHTML=render(f,i);
  scr.classList.toggle('fadein',animate&&step.screen.t!=='chat');
  // 聊天畫面：已有的訊息不重播動畫
  if(animate&&step.screen.t==='chat'&&prevN>=0){
    const prev=F[f].steps[prevN];
    if(prev&&prev.screen.t==='chat'){
      const olds=prev.screen.msgs.length;
      [...scr.querySelectorAll('.chat>.pop')].forEach((e,k)=>{if(k<olds&&prev.screen.msgs[k]&&JSON.stringify(prev.screen.msgs[k])===JSON.stringify(step.screen.msgs[k])){e.classList.remove('pop');e.style.opacity=1}else{e.style.setProperty('--d',(0.15+k*0.0)+'s')}});
    }
  }
  if(animate){const pops=[...scr.querySelectorAll('.pop')];pops.forEach((e,k)=>e.style.setProperty('--d',(0.1+k*0.35)+'s'))}
  ringAt(scr,step.tap,step.tap==='mic');
  prevN=i;
}
function mount(){
  const f=F[cur];
  $('#panel').innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
   <div class="head"><div class="txt"><h2>${f.title}</h2><p class="sub">${f.tag}</p></div><div class="chips">${f.chips.map((c,k)=>`<span class="chip${k?' alt':''}">${c}</span>`).join('')}</div></div>
   <div class="viewer"><div class="left"><div class="phonewrap"><div class="phone"><div class="island"></div><div class="screen" id="scr"></div></div></div>
   <div class="ctrl"><button class="btn" id="bp">◀ 上一步</button><button class="btn primary" id="bpl">▶ 播放</button><button class="btn" id="bn">下一步 ▶</button></div>
   <div class="ctrl"><div class="dots" id="dots"></div><span class="count" id="cnt"></span></div></div>
   <ol class="steps" id="steps"></ol></div></div>`;
  $('#steps').innerHTML=f.steps.map((s,k)=>`<li><button class="stp" data-i="${k}"><span class="n">${k+1}</span><span class="t">${s.title}</span><span class="body"><span class="d">${s.op}</span><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul></span></button></li>`).join('');
  $('#dots').innerHTML=f.steps.map((_,k)=>`<button data-i="${k}" aria-label="第 ${k+1} 步"></button>`).join('');
  $('#bp').onclick=()=>{stop();go(idx-1)};$('#bn').onclick=()=>{stop();go(idx+1)};
  $('#bpl').onclick=()=>playing?stop():play();
  $('#steps').onclick=e=>{const b=e.target.closest('.stp');if(b){stop();go(+b.dataset.i)}};
  $('#dots').onclick=e=>{const b=e.target.closest('button');if(b){stop();go(+b.dataset.i)}};
  fitPhone();prevN=-1;go(0);
}
function paint(){
  const f=F[cur];
  [...document.querySelectorAll('.stp')].forEach((b,k)=>b.setAttribute('aria-current',k===idx?'step':'false'));
  [...document.querySelectorAll('#dots button')].forEach((b,k)=>{b.setAttribute('aria-current',k===idx?'step':'false');b.classList.toggle('done',k<idx)});
  $('#cnt').textContent=(idx+1)+'/'+f.steps.length;
}
function go(i){idx=Math.max(0,Math.min(F[cur].steps.length-1,i));show(cur,idx,true);paint()}
function stop(){clearInterval(timer);timer=null;playing=false;const b=$('#bpl');if(b)b.textContent='▶ 播放'}
function play(){stop();playing=true;$('#bpl').textContent='❚❚ 暫停';if(idx>=F[cur].steps.length-1){prevN=-1;go(0)}
  timer=setInterval(()=>{if(idx>=F[cur].steps.length-1){stop();return}go(idx+1)},4800)}
function fitPhone(){const w=document.documentElement.clientWidth;document.documentElement.style.setProperty('--ps',w<520?Math.max(.62,(w-80)/418):.8)}
addEventListener('resize',fitPhone);
$('#tabs').innerHTML=F.map((f,k)=>`<button role="tab" aria-selected="${k===0}" data-k="${k}">${f.tab}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;stop();cur=+b.dataset.k;[...$('#tabs').children].forEach((x,k)=>x.setAttribute('aria-selected',k===cur));mount();try{history.replaceState(null,'','#f'+(cur+1))}catch(_){}};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(idx+1)}else if(e.key==='ArrowLeft'){stop();go(idx-1)}else if(e.key===' '&&document.activeElement===document.body){e.preventDefault();playing?stop():play()}});

if(STILL){
  document.body.classList.add('still');
  const f=(+Q.get('f')||1)-1,s=(+Q.get('s')||1)-1;cur=f;
  document.documentElement.style.setProperty('--ps',1);
  $('#stillhost').innerHTML=`<div class="phone noanim" style="transform:none"><div class="island"></div><div class="screen" id="scr"></div></div>`;
  document.fonts.ready.then(()=>{show(f,s,false);document.title='ready'});
}else{
  const h=(location.hash.match(/f([123])/)||[])[1];if(h)cur=+h-1;
  [...$('#tabs').children].forEach((x,k)=>x.setAttribute('aria-selected',k===cur));
  mount();
}
</script>
